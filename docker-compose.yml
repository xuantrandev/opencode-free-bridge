# OpenCode Free Bridge — fully containerized OpenAI-compatible gateway.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Only the bridge API is published, and only on 127.0.0.1 by default
# (BRIDGE_BIND / BRIDGE_PORT in .env). The OpenCode upstream server (4577)
# and the internal discovery agent (4578) stay on the Docker-internal
# network and are never exposed to the host.

name: opencode-free-bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  opencode-server:
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.3}
    image: opencode-free-bridge/opencode-server:${IMAGE_TAG:-dev}
    container_name: opencode-server
    env_file:
      - path: .env
        required: false
    environment:
      # opencode serve listens inside the container only; the port is not
      # published to the host.
      OPENCODE_BIN: opencode
      OPENCODE_SERVE_HOSTNAME: 0.0.0.0
      OPENCODE_SERVE_PORT: "4577"
      OPENCODE_UPSTREAM: http://127.0.0.1:4577
      # Internal discovery agent (token-protected).
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "4578"
      AGENT_TOKEN: ${DISCOVERY_TOKEN:-}
      AGENT_SUPERVISE: "1"
      AGENT_CMD_TIMEOUT_MS: ${MODEL_DISCOVERY_TIMEOUT_MS:-60000}
      # Optional basic auth for the upstream server itself (both containers
      # must agree; the bridge client already sends these headers).
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
    expose:
      - "4577"
      - "4578"
    volumes:
      # Persistent OpenCode authentication + data (auth.json, sessions, db).
      - opencode-data:/home/opencode/.local/share
      - opencode-config:/home/opencode/.config
      - opencode-cache:/home/opencode/.cache
      - opencode-state:/home/opencode/.local/state
    healthcheck:
      test: ["CMD", "node", "/opt/opencode/opencode-agent.mjs", "healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  opencode-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    image: opencode-free-bridge/bridge:${IMAGE_TAG:-dev}
    container_name: opencode-bridge
    depends_on:
      opencode-server:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5577"
      # Inside the container the bridge must accept requests from the Docker
      # gateway; host exposure is still restricted to 127.0.0.1 below.
      ALLOW_NON_LOOPBACK: "true"
      OPENCODE_UPSTREAM: http://opencode-server:4577
      OPENCODE_BIN: opencode
      # Discovery runs inside the opencode-server container via the agent.
      DISCOVERY_URL: http://opencode-server:4578
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:-}
      # Optional gateway API key for /v1/* (constant-time compared).
      BRIDGE_API_KEY: ${BRIDGE_API_KEY:-}
      BRIDGE_API_KEY_FILE: ${BRIDGE_API_KEY_FILE:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      LOG_FILE: "-"
    ports:
      # Localhost-only by default. Change BRIDGE_BIND only if you put a
      # reverse proxy with authentication in front.
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-5577}:5577"
    volumes:
      # Live model registry + exclusions + metadata (persists across recreation).
      - bridge-config:/app/config
      - bridge-state:/app/state
      - bridge-backups:/app/backups
      - bridge-logs:/app/logs
      - bridge-run:/app/run
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      # Liveness only: a temporary provider outage must not restart the bridge.
      test: ["CMD", "bridge-cli", "health", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256

volumes:
  opencode-data:
  opencode-config:
  opencode-cache:
  opencode-state:
  bridge-config:
  bridge-state:
  bridge-backups:
  bridge-logs:
  bridge-run:
